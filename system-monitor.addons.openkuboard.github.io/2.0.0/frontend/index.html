<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>资源层监控套件 · system-monitor</title>
  </head>
  <body>
    <div id="app"></div>
    <!--
      注：addon-sdk 由 host 在 /addon-sdk/index.js 静态挂载（FR-5）。
      源码（src/main.ts）在运行时以动态 import('/addon-sdk/index.js') 加载它，
      因此不在此处写死的 <script src> —— 否则 Vite 构建期会尝试解析该绝对路径而失败。
      构建产物 dist/index.html 只保留本应用自身的入口。
      合并后的单入口按 URL 锚区分页面：index.html#config → config 配置页，
      index.html#usage（或空 hash）→ usage 使用页；标题由 main.ts 按所选页覆盖。
    -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
